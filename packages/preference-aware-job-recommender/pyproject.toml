[project]
name = "preference-aware-job-recommender"
version = "0.1.0"
description = "Rank sample jobs against a structured career profile using explainable preference-aware scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
job-recommend = "preference_aware_job_recommender.cli:main"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
