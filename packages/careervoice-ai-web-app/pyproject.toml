[project]
name = "careervoice-ai-web-app"
version = "0.1.0"
description = "Streamlit web application for the CareerVoice AI job recommendation workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "careervoice-ai-orchestrator",
    "openai>=2.46.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.59.0,<2.0.0",
    "supabase>=2.31.0,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
local-runtime = [
    "job-listing-collector",
    "preference-aware-job-recommender",
    "voice-career-profile-extractor",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
