[project]
name = "careervoice-ai-deployment"
version = "0.1.0"
description = "Deployment assembly for the CareerVoice AI web application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "careervoice-ai-orchestrator==0.1.0",
    "careervoice-ai-web-app==0.1.0",
    "fastapi>=0.141.1",
    "job-listing-collector==0.1.0",
    "preference-aware-job-recommender==0.1.0",
    "uvicorn>=0.52.1",
    "voice-career-profile-extractor==0.1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.0.3",
    "ruff==0.15.13",
]

[tool.uv]
package = false

[tool.uv.sources]
"careervoice-ai-orchestrator" = { path = "packages/careervoice-ai-orchestrator" }
"careervoice-ai-web-app" = { path = "packages/careervoice-ai-web-app" }
"job-listing-collector" = { path = "packages/job-listing-collector" }
"preference-aware-job-recommender" = { path = "packages/preference-aware-job-recommender" }
"voice-career-profile-extractor" = { path = "packages/voice-career-profile-extractor" }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/careervoice-ai-orchestrator/tests",
    "packages/careervoice-ai-web-app/tests",
    "packages/job-listing-collector/tests",
    "packages/preference-aware-job-recommender/tests",
    "packages/voice-career-profile-extractor/tests",
]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py311"
