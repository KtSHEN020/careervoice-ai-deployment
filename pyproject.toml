[project]
name = "careervoice-ai-deployment"
version = "0.1.0"
description = "Deployment assembly for the CareerVoice AI web application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"